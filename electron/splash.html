<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: white;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .splash {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
      }

      .logo {
        width: 120px;
        height: 120px;
        filter: invert(1);
      }

      .title {
        font-family: "Segoe UI", -apple-system, sans-serif;
        color: black;
        font-size: 26px;
        letter-spacing: 1px;
      }
    </style>
  </head>
  <body>
    <div class="splash">
      <img class="logo" src="./logo.png" alt="" />
      <div class="title">Stone Arch</div>
    </div>
  </body>
</html>
