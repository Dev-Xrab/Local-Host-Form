name: Build Windows

# Builds the NSIS installer on GitHub's Windows runner, so the release doesn't depend on a
# local Windows machine (or wine on Linux). Trigger it manually from the Actions tab, or by
# pushing a version tag.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach the build to (e.g. v1.3.0). Leave empty to only keep it as a workflow artifact."
        required: false
  push:
    tags:
      - "v*.*.*"
    # The repo's default branch (main) is docs-only; the app source lives on drive-sync.
    branches:
      - drive-sync
    paths:
      - ".github/workflows/build-windows.yml"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      # No code-signing certificate is configured, so this installer is unsigned and Windows
      # SmartScreen will warn on first run.
      - name: Build Windows installer
        run: npx electron-builder --win --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: self-host-form-windows
          path: release/*.exe
          if-no-files-found: error

      # Attach to the GitHub release under the fixed name the website links to
      # (releases/latest/download/Self-Host-Form-Setup.exe), plus a versioned copy for history.
      - name: Upload to release
        shell: bash
        run: |
          if [ -n "${{ inputs.tag }}" ]; then TAG="${{ inputs.tag }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then TAG="${{ github.ref_name }}"
          else TAG="v$(node -p "require('./package.json').version")"; fi
          VERSION="${TAG#v}"
          echo "Uploading to release $TAG"
          cp "release/Self Host Form Setup $VERSION.exe" release/Self-Host-Form-Setup.exe
          cp "release/Self Host Form Setup $VERSION.exe" "release/Self-Host-Form-Setup-$VERSION.exe"
          gh release upload "$TAG" release/Self-Host-Form-Setup.exe "release/Self-Host-Form-Setup-$VERSION.exe" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
